<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pensec API reference</title>
    <meta name="description" content="Interactive reference for the Pensec report submission API, generated from the OpenAPI contract.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body { margin: 0; background: #05070e; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="/vendor/scalar/standalone.js"></script>
    <script>
        Scalar.createApiReference('#app', {
            url: '/api/openapi.yaml',
            theme: 'deepSpace',
            darkMode: true,
            hideDarkModeToggle: true,
            metaData: {
                title: 'Pensec API reference',
            },
        });
    </script>
</body>
</html>
